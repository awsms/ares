name: Push
on:
  push
concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    name: Build ares (primary)
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      codesign: true
      official: ${{ github.ref_name == 'master' || github.ref_type == 'tag' }}
  build-aux:
    name: Build ares (auxiliary)
    uses: ./.github/workflows/build-aux.yml
    secrets: inherit
  build-windows-ra:
    name: Build ares (Windows MSVC x64, RA)
    if: github.ref == 'refs/heads/feat/ra-win'
    uses: ./.github/workflows/build-windows-ra.yml
    permissions:
      contents: read
  release:
    name: Release
    needs: build
    secrets: inherit
    uses: ./.github/workflows/release.yml
    with:
      notarize: true
